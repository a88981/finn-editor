<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 排程規劃 · Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7;--ink:#1A1F2E;--ink-soft:#5A6275;--ink-light:#9BA1B0;
  --line:#E5E7ED;--line-soft:#F0F2F6;
  --yellow:#E8B340;--yellow-mid:#B8862A;--yellow-pale:#FFF8DC;--yellow-lightest:#FFFBEC;
  --green:#6E9962;--red:#C0504D;--acc:#B8862A;
  --c-cut1:#D89A3A;--c-v1:#C9A227;--c-biz:#B8860B;--c-fin:#7A6432;
  --c-cut1-bg:#fdf6ea;--c-v1-bg:#fbf6e0;--c-biz-bg:#faf3d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E8E8E2;color:var(--ink);font-family:'Noto Sans TC','Inter',sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.viewport{padding:24px 16px 80px;display:flex;justify-content:center}
.page{width:100%;max-width:1100px;background:var(--paper);padding:28px 36px 32px;position:relative;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,0.04),0 8px 24px rgba(0,0,0,0.06)}
.eyebrow{font-family:Inter,sans-serif;font-size:10px;letter-spacing:0.35em;color:var(--ink-light);text-transform:uppercase;font-weight:500;margin-bottom:8px}
.title-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:500;color:var(--ink);letter-spacing:-0.01em}
.title-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--ink-light);font-weight:400}
.subtitle{font-size:12px;color:var(--ink-soft);margin-bottom:18px}
.subtitle a{color:var(--yellow-mid);text-decoration:none;border-bottom:1px dotted}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.btn{background:transparent;border:0.5px solid var(--line);border-radius:3px;padding:6px 11px;color:var(--ink-soft);font-family:inherit;font-size:11.5px;cursor:pointer;letter-spacing:0.05em;font-weight:500}
.btn:hover{background:var(--yellow-lightest);color:var(--yellow-mid);border-color:var(--yellow)}
.btn.primary{background:var(--yellow);color:#fff;border-color:var(--yellow)}
.btn.primary:hover{background:var(--yellow-mid);color:#fff}
.btn.primary[disabled]{background:var(--ink-light);border-color:var(--ink-light);cursor:not-allowed}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:#fdf0ef}
.month-nav{display:flex;align-items:center;gap:8px}
.month-label{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:500;color:var(--ink);min-width:96px;text-align:center}
.dirty-badge{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--red);letter-spacing:0.02em}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-left:auto;font-size:10px;color:var(--ink-light)}
.legend>div{display:flex;align-items:center;gap:4px}
.legend .swatch{width:12px;height:8px;border-radius:2px;flex-shrink:0;opacity:0.7}
.legend .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.gantt{margin-top:18px}
.month-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:500;color:var(--ink);padding:8px 0;border-bottom:1px solid var(--yellow);margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.month-title::after{content:"";flex:1}
.gantt-head{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:end;font-size:9.5px;color:var(--ink-light);font-family:Inter,sans-serif;letter-spacing:0.04em;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.gantt-head-days{display:flex;font-variant-numeric:tabular-nums}
.gantt-head-days>div{flex:1;text-align:center}
.gantt-head-days .we{color:var(--red);opacity:0.6}
.gantt-row{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line-soft);min-height:42px}
.gantt-row:hover{background:rgba(232,179,64,0.03)}
.row-label{font-size:12px;color:var(--ink);line-height:1.3;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding-right:4px}
.row-label .name{font-weight:500;font-family:'Noto Serif TC',serif}
.row-label .name.dirty::after{content:" •";color:var(--red);font-family:sans-serif}
.row-label .meta{font-size:10px;color:var(--ink-light)}
.row-label .client{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.row-canvas{position:relative;height:24px;background:repeating-linear-gradient(90deg,transparent,transparent calc(100%/30 - 0.5px),var(--line-soft) calc(100%/30 - 0.5px),var(--line-soft) calc(100%/30))}
.row-canvas .today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);opacity:0.4;z-index:5;border-radius:1px}
.bar-item{position:absolute;top:2px;bottom:2px;border-radius:3px;display:flex;align-items:center;padding:0 6px;font-size:10px;color:#fff;font-weight:500;cursor:pointer;overflow:hidden;white-space:nowrap;font-family:Inter,sans-serif;letter-spacing:0.02em}
.bar-item.done{opacity:0.45}
.bar-item:hover{filter:brightness(0.92);box-shadow:0 0 0 2px rgba(0,0,0,0.08)}
.bar-cut1{background:var(--c-cut1)}
.bar-v1{background:var(--c-v1)}
.bar-biz{background:var(--c-biz)}
.dot-item{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:3;border:1.5px solid #fff;box-shadow:0 0 0 0.5px rgba(0,0,0,0.15)}
.dot-item.done{opacity:0.4}
.dot-item:hover{transform:translate(-50%,-50%) scale(1.3)}
.dot-cut1{background:var(--c-cut1)}
.dot-v1{background:var(--c-v1)}
.dot-biz{background:var(--c-biz)}
.dot-fin{background:var(--c-fin)}

.empty{padding:40px;text-align:center;color:var(--ink-light);font-size:13px}

.save-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--yellow);border-radius:24px;padding:12px 22px;box-shadow:0 4px 24px rgba(0,0,0,0.12);display:flex;align-items:center;gap:14px;z-index:100;font-size:13px}
.save-bar .label{color:var(--ink-soft)}
.save-bar .count{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--red);font-size:16px;font-weight:500}

.modal-overlay{position:fixed;inset:0;background:rgba(20,20,15,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:6px;padding:24px;width:100%;max-width:840px;max-height:90vh;overflow:auto}
.modal-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:4px}
.modal-sub{font-size:11px;color:var(--ink-light);margin-bottom:16px}

.mfull{background:var(--yellow-lightest);border:0.5px solid var(--yellow-pale);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.mfull-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mfull-icon{font-size:15px}
.mfull-title{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:500;color:var(--yellow-mid)}
.mday-badge{font-family:Inter,sans-serif;font-size:10px;letter-spacing:0.05em;background:var(--yellow);color:#fff;padding:2px 8px;border-radius:10px;font-weight:500}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.mstage-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px}
.mstage{border:0.5px solid var(--line);border-radius:6px;padding:12px 14px;background:#fff}
.mstage.stage-cut1{border-color:#F5DEB3;background:#fdf6ea}
.mstage.stage-v1{border-color:#E6D89A;background:#fbf6e0}
.mstage.stage-biz{border-color:#D9C28C;background:#faf3d8}
.mstage.is-skip{opacity:0.55}
.mstage-hd{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.mstage-icon{font-size:14px}
.mstage-title{font-family:'Noto Serif TC',serif;font-size:13px;font-weight:500;color:var(--ink)}
.mstage-skip{font-size:10px;color:var(--ink-light);margin-left:auto;display:flex;align-items:center;gap:3px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.mstage-skip input{margin:0;cursor:pointer}

@media(max-width:680px){.row3,.mstage-row{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.flabel{font-family:Inter,sans-serif;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-light);font-weight:500;margin-bottom:4px}
.fc{width:100%;padding:8px 10px;border:0.5px solid var(--line);border-radius:3px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff;font-variant-numeric:tabular-nums}
.fc:focus{outline:none;border-color:var(--yellow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}

.toast{position:fixed;top:30px;right:30px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:12px;z-index:300;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,0.2)}

.pnote{font-size:11.5px;color:var(--ink-soft);background:var(--yellow-lightest);border:0.5px solid var(--yellow-pale);border-radius:4px;padding:10px 12px;margin-bottom:14px;line-height:1.65}
.pnote b{color:var(--yellow-mid);font-weight:500}
.pta{width:100%;padding:10px 12px;border:0.5px solid var(--line);border-radius:4px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;line-height:1.6;color:var(--ink);background:#FCFCFA;resize:vertical}
.pta:focus{outline:none;border-color:var(--yellow)}
.pstep{display:flex;align-items:center;gap:7px;margin:16px 0 8px}
.pstep-n{font-family:Inter,sans-serif;font-size:9.5px;font-weight:500;background:var(--yellow);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pstep-t{font-family:'Noto Serif TC',serif;font-size:12.5px;font-weight:500;color:var(--ink)}
.pstep-h{font-size:10.5px;color:var(--ink-light);margin-left:auto}
.off-row{display:grid;grid-template-columns:1fr 1fr 1.1fr 26px;gap:7px;align-items:center;margin-bottom:6px}
.off-row .fc{padding:6px 8px;font-size:12px}
.off-x{border:0.5px solid var(--line);background:transparent;border-radius:3px;color:var(--ink-light);cursor:pointer;font-size:12px;height:29px;font-family:inherit}
.off-x:hover{color:var(--red);border-color:var(--red);background:#fdf0ef}
.off-add{font-size:11px;color:var(--yellow-mid);background:transparent;border:0.5px dashed var(--yellow);border-radius:3px;padding:6px 10px;cursor:pointer;font-family:inherit;width:100%;margin-top:2px}
.off-add:hover{background:var(--yellow-lightest)}
.off-empty{font-size:11px;color:var(--ink-light);padding:2px 0 6px}
.imp-item{display:grid;grid-template-columns:22px 1fr;gap:8px;border:0.5px solid var(--line);border-radius:5px;padding:11px 13px;margin-bottom:8px;background:#fff}
.imp-item.miss{background:#fdf6f5;border-color:#EDC9C7}
.imp-check{padding-top:2px}
.imp-check input{cursor:pointer;margin:0}
.imp-name{font-family:'Noto Serif TC',serif;font-size:13px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.imp-tag{font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:0.06em;padding:1.5px 7px;border-radius:9px;font-weight:500}
.imp-tag.ok{background:var(--yellow-pale);color:var(--yellow-mid)}
.imp-tag.warn{background:#fdece9;color:var(--red)}
.imp-tag.same{background:var(--line-soft);color:var(--ink-light)}
.imp-target{font-size:10.5px;color:var(--ink-light);margin-top:3px}
.imp-note2{font-size:10.5px;color:var(--yellow-mid);margin-top:3px}
.imp-diff{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.imp-d{font-family:Inter,sans-serif;font-size:10.5px;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.imp-d .k{color:var(--ink-light);min-width:58px;letter-spacing:0.03em}
.imp-d .old{color:var(--ink-light);text-decoration:line-through}
.imp-d .new{color:var(--acc);font-weight:500}
.imp-err{background:#fdf0ef;border:0.5px solid #EDC9C7;color:var(--red);font-size:11.5px;border-radius:4px;padding:10px 12px;margin-bottom:12px;line-height:1.6}
.sum{border:0.5px solid var(--yellow-pale);background:var(--yellow-lightest);border-radius:6px;padding:14px 16px;margin:14px 0 4px}
.sum-hd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sum-title{font-family:'Noto Serif TC',serif;font-size:13.5px;font-weight:500;color:var(--yellow-mid)}
.sum-x{margin-left:auto;background:transparent;border:0;color:var(--ink-light);cursor:pointer;font-size:12px;font-family:inherit;padding:2px 4px}
.sum-x:hover{color:var(--red)}
.sum-body{margin-top:10px}
.sum-i{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:7px 0;border-top:0.5px dashed var(--yellow-pale);font-size:12px;line-height:1.6}
.sum-i:first-child{border-top:0}
.sum-k{font-family:Inter,sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--yellow-mid);font-weight:500;padding-top:2px}
.sum-v{color:var(--ink-soft);white-space:pre-wrap}
.row-label .name .flag{font-size:11px;margin-left:1px}
.row-label .pnote-s{font-size:9.5px;color:var(--yellow-mid);line-height:1.35;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock-row{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:start;border:0.5px solid var(--line);border-radius:5px;padding:9px 11px;margin-bottom:6px;background:#fff}
.lock-row.on{background:var(--yellow-lightest);border-color:var(--yellow-pale)}
.lock-row input{cursor:pointer;margin:2px 0 0}
.lock-nm{font-size:12.5px;font-weight:500;font-family:'Noto Serif TC',serif;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lock-meta{font-size:10.5px;color:var(--ink-light);margin-top:2px;font-variant-numeric:tabular-nums}
.lock-tag{font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:0.06em;padding:1.5px 7px;border-radius:9px;font-weight:500;background:var(--line-soft);color:var(--ink-light)}
.lock-tag.stale{background:#fdece9;color:var(--red)}
.lock-sum{font-size:11px;color:var(--ink-soft);margin:2px 0 10px}

.loading{padding:60px;text-align:center;color:var(--ink-light);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px}
.error{padding:30px;text-align:center;color:var(--red);font-size:13px}
.build-tag{font-size:10px;letter-spacing:.5px;color:var(--muted,#999);opacity:.6;margin-left:8px}
.mcount{font-size:10px;color:var(--muted,#999);opacity:.75;margin:0 4px 0 8px;white-space:nowrap}
.mode-row{display:flex;gap:6px;margin:2px 0 8px;flex-wrap:wrap}
.mode-b{font-family:'Noto Serif TC',serif;font-size:11.5px;padding:5px 12px;border:0.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink-light);cursor:pointer;transition:.12s}
.mode-b:hover{border-color:var(--yellow-pale);color:var(--ink)}
.mode-b.on{background:var(--yellow-lightest);border-color:var(--yellow);color:var(--ink);font-weight:500}
.note-in{margin-top:6px;padding:5px 8px;font-size:11px;border:0.5px dashed var(--line);border-radius:3px;width:100%;background:#FCFCFA}
.note-in:focus{outline:none;border-style:solid;border-color:var(--yellow);background:#fff}
.note-in::placeholder{color:var(--ink-light);opacity:.65}
.nextfree{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border:0.5px solid var(--yellow-pale);background:var(--yellow-lightest);border-radius:5px;padding:8px 13px;margin:2px 0 14px}
.nf-k{font-family:'Noto Serif TC',serif;font-size:11.5px;color:var(--yellow-mid);font-weight:500}
.nf-d{font-family:Inter,sans-serif;font-size:15px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0.02em}
.nf-n{font-size:10.5px;color:var(--ink-light);margin-left:auto}
</style>

<body>
<div class="viewport"><div class="page" id="root">
<div class="loading">讀取中…</div>
</div></div>

<script>
var API="/api/notion";
var PLAN_BUILD="V14";
var state={
  projects:[],
  loading:true,
  error:null,
  ym:[new Date().getFullYear(),new Date().getMonth()+1],
  monthsOverride:null,
  mCount:2,
  edits:{},
  modal:null,
  exp:null,
  imp:null,
  summary:null,
  planNotes:{},
  toast:null
};

function showToast(msg){
  state.toast=msg;render();
  setTimeout(function(){state.toast=null;render();},2500);
}

function fmt(d){
  if(!d)return "";
  var p=d.split("-");
  return (+p[1])+"/"+(+p[2]);
}
function toDate(s){if(!s)return null;var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function ymKey(yr,mo){return yr+"-"+String(mo).padStart(2,"0");}
function isWeekend(yr,mo,day){var d=new Date(yr,mo-1,day).getDay();return d===0||d===6;}

function getField(p,field){
  if(state.edits[p.id]&&field in state.edits[p.id])return state.edits[p.id][field];
  return p[field];
}
function setField(p,field,val){
  if(!state.edits[p.id])state.edits[p.id]={notionId:p.notionId,name:p.name};
  state.edits[p.id][field]=val;
}
function clearEdit(pid){delete state.edits[pid];}
function dirtyCount(){return Object.keys(state.edits).length;}

function load(){
  state.loading=true;state.error=null;render();
  fetch(API+"?action=list").then(function(r){return r.json();}).then(function(data){
    var arr=Array.isArray(data)?data:(data.projects||[]);
    state.projects=arr;
    state.loading=false;render();
  }).catch(function(e){
    state.error=String(e);state.loading=false;render();
  });
}

function saveAll(){
  var ids=Object.keys(state.edits);
  if(ids.length===0)return;
  if(!confirm("確定要把 "+ids.length+" 筆改動寫回 Notion?"))return;
  var btn=document.getElementById("save-btn");
  if(btn){btn.disabled=true;btn.textContent="存入中…";}
  var promises=ids.map(function(pid){
    var e=state.edits[pid];
    var orig=state.projects.find(function(x){return x.id===pid;});
    var full=Object.assign({},orig,e);
    return fetch(API+"?action=update",{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(full)
    }).then(function(r){return r.json();}).then(function(d){
      if(d.error)throw new Error(d.error);
      return{pid:pid,ok:true};
    }).catch(function(err){
      return{pid:pid,ok:false,err:String(err)};
    });
  });
  Promise.all(promises).then(function(results){
    var fails=results.filter(function(r){return !r.ok;});
    if(fails.length===0){
      state.edits={};
      showToast("✅ 已存回 "+ids.length+" 筆");
      load();
    } else {
      results.forEach(function(r){if(r.ok)clearEdit(r.pid);});
      showToast("⚠ "+fails.length+" 筆失敗,其餘已存");
      render();
    }
  });
}

function openEdit(p){
  state.modal={
    pid:p.id,
    name:p.name,
    client:p.client,
    cut1S:getField(p,"cut1S")||"",
    cut1E:getField(p,"cut1E")||"",
    cut1Due:getField(p,"cut1Due")||"",
    v1S:getField(p,"v1S")||"",
    v1E:getField(p,"v1E")||"",
    v1Due:getField(p,"v1Due")||"",
    bizS:getField(p,"bizS")||"",
    bizE:getField(p,"bizE")||"",
    bizDue:getField(p,"bizDue")||"",
    finalDue:getField(p,"finalDue")||"",
    noCut1:p.noCut1,
    noBiz:p.noBiz
  };
  render();
}
function closeModal(){state.modal=null;render();}
function saveModal(){
  var m=state.modal;
  var p=state.projects.find(function(x){return x.id===m.pid;});
  if(!p){closeModal();return;}
  var changed=false;
  ["cut1S","cut1E","cut1Due","v1S","v1E","v1Due","bizS","bizE","bizDue","finalDue"].forEach(function(f){
    var orig=(p[f]==null?"":p[f]);
    var cur=(m[f]==null?"":m[f]);
    if(orig!==cur){setField(p,f,cur);changed=true;}
  });
  ["noCut1","noBiz"].forEach(function(f){
    var orig=!!p[f],cur=!!m[f];
    if(orig!==cur){setField(p,f,cur);changed=true;}
  });
  if(!changed)clearEdit(m.pid);
  closeModal();
}
function discardEdit(pid){
  if(confirm("取消這個案的所有改動?")){clearEdit(pid);render();}
}

function changeYm(delta){
  var yr=state.ym[0],mo=state.ym[1];
  mo+=delta;
  if(mo<1){mo=12;yr--;}
  if(mo>12){mo=1;yr++;}
  state.ym=[yr,mo];render();
}
function thisMonth(){var n=new Date();state.ym=[n.getFullYear(),n.getMonth()+1];render();}

function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function buildRow(p,yr,mo,dim){
  function clamp(s,e){
    var sd=toDate(s),ed=toDate(e||s);if(!sd||!ed)return null;
    var monthStart=new Date(yr,mo-1,1),monthEnd=new Date(yr,mo,0);
    if(ed<monthStart||sd>monthEnd)return null;
    var s2=sd<monthStart?1:sd.getDate();
    var e2=ed>monthEnd?dim:ed.getDate();
    return{s:s2,e:e2};
  }
  function dayIfThis(s){
    var d=toDate(s);if(!d)return null;
    if(d.getFullYear()===yr&&d.getMonth()+1===mo)return d.getDate();
    return null;
  }
  var bars=[];
  if(!p.noCut1){var r=clamp(getField(p,"cut1S"),getField(p,"cut1E"));if(r)bars.push({k:"cut1",s:r.s,e:r.e,done:p.cut1Done,label:"初剪"});}
  var r2=clamp(getField(p,"v1S"),getField(p,"v1E"));if(r2)bars.push({k:"v1",s:r2.s,e:r2.e,done:p.v1Done,label:"V1"});
  if(!p.noBiz){var r3=clamp(getField(p,"bizS"),getField(p,"bizE"));if(r3)bars.push({k:"biz",s:r3.s,e:r3.e,done:p.bizDone,label:"業配"});}
  var dots=[];
  if(!p.noCut1){var d=dayIfThis(getField(p,"cut1Due"));if(d)dots.push({k:"cut1",d:d,done:p.cut1Done});}
  var d2=dayIfThis(getField(p,"v1Due"));if(d2)dots.push({k:"v1",d:d2,done:p.v1Done});
  if(!p.noBiz){var d3=dayIfThis(getField(p,"bizDue"));if(d3)dots.push({k:"biz",d:d3,done:p.bizDone});}
  var d4=dayIfThis(getField(p,"finalDue"));if(d4)dots.push({k:"fin",d:d4,done:p.finalDone});
  return{bars:bars,dots:dots};
}

/* 甘特圖要畫幾個月：手動指定優先，否則看排程最遠的日期(最少 2、最多 12) */
function ganttMonths(visible,yr,mo){
  if(state.monthsOverride){
    return Math.min(12,Math.max(1,state.monthsOverride));
  }
  var last=null;
  function bump(v){
    if(!v)return;
    var d=toDate(v);if(!d)return;
    if(!last||d>last)last=d;
  }
  visible.forEach(function(p){
    var keys=["v1S","v1E","v1Due","finalDue"];
    if(!p.noCut1)keys=keys.concat(["cut1S","cut1E","cut1Due"]);
    if(!p.noBiz)keys=keys.concat(["bizS","bizE","bizDue"]);
    keys.forEach(function(k){bump(getField(p,k));});
    /* 上片日也要算：還沒排之前，它是唯一能看出這次要排到幾月的依據 */
    var ak=airKey(p);
    if(ak&&ak!=="9999-99-99")bump(ak);
  });
  var n=2;
  if(last){
    var diff=(last.getFullYear()-yr)*12+(last.getMonth()+1-mo)+1;
    if(diff>n)n=diff;
  }
  if(n>12)n=12;
  return n;
}

/* 手動增減月份，不用等資料裡有日期 */
function addMonths(d){
  var n=(state.monthsOverride||state.mCount||2)+d;
  if(n<1)n=1;
  if(n>12)n=12;
  state.monthsOverride=n;
  render();
}
function autoMonths(){state.monthsOverride=null;render();}

/* 從起始年月往後展開 n 個月，回傳 [[年,月],…] */
function monthList(yr,mo,n){
  var out=[];
  for(var i=0;i<n;i++){
    var y2=yr,m2=mo+i;
    while(m2>12){m2-=12;y2++;}
    out.push([y2,m2]);
  }
  return out;
}

/* 月份導覽列的文字，例如「2026年 7–10月」或「2026年12月 – 2027年2月」 */
function monthRangeLabel(list){
  var a=list[0],b=list[list.length-1];
  if(a[0]===b[0]){
    return a[0]+"年 "+a[1]+(list.length>1?"–"+b[1]:"")+"月";
  }
  return a[0]+"年"+a[1]+"月 – "+b[0]+"年"+b[1]+"月";
}

function renderGanttMonth(visible,yr,mo,now){
  var dim=new Date(yr,mo,0).getDate();
  var todayCol=(now.getFullYear()===yr&&now.getMonth()+1===mo)?now.getDate():null;
  var html='';
  html+='<div class="gantt"><div class="month-title">'+yr+'年 '+mo+'月</div>';
  html+='<div class="gantt-head"><div>專案</div><div class="gantt-head-days">';
  for(var d=1;d<=dim;d++){
    html+='<div'+(isWeekend(yr,mo,d)?' class="we"':'')+'>'+d+'</div>';
  }
  html+='</div></div>';
  var rowsHtml=visible.map(function(p){
    var rd=buildRow(p,yr,mo,dim);
    if(rd.bars.length===0&&rd.dots.length===0)return null;
    var pct=100/dim;
    var isDirty=!!state.edits[p.id];
    var row='<div class="gantt-row">';
    row+='<div class="row-label" onclick="openEdit(state.projects.find(function(x){return x.id===\''+p.id+'\';}))">';
    var pn=state.planNotes[p.id]||null;
    row+='<div class="name'+(isDirty?' dirty':'')+'">'+escapeHtml(p.name)+(pn&&pn.flag?' <span class="flag">'+escapeHtml(pn.flag)+'</span>':'')+'</div>';
    row+='<div class="meta">'+escapeHtml(p.client||"")+(p.airDate?" · "+p.airDate+"上片":"")+'</div>';
    if(pn&&pn.note)row+='<div class="pnote-s" title="'+escAttr(pn.note)+'">'+escapeHtml(pn.note)+'</div>';
    row+='</div>';
    row+='<div class="row-canvas">';
    if(todayCol!==null){
      row+='<div class="today" style="left:'+((todayCol-0.5)*pct)+'%"></div>';
    }
    rd.bars.forEach(function(b){
      var left=(b.s-1)*pct;
      var width=(b.e-b.s+1)*pct;
      row+='<div class="bar-item bar-'+b.k+(b.done?' done':'')+'" style="left:'+left+'%;width:'+width+'%" onclick="openEdit(state.projects.find(function(x){return x.id===\''+p.id+'\';}))">'+b.label+'</div>';
    });
    rd.dots.forEach(function(d){
      row+='<div class="dot-item dot-'+d.k+(d.done?' done':'')+'" style="left:'+((d.d-0.5)*pct)+'%" onclick="openEdit(state.projects.find(function(x){return x.id===\''+p.id+'\';}))" title="交"></div>';
    });
    row+='</div></div>';
    return row;
  }).filter(Boolean);
  if(rowsHtml.length===0){
    html+='<div class="empty" style="padding:20px;font-size:12px">這個月沒有排到任何案</div>';
  } else {
    html+=rowsHtml.join("");
  }
  html+='</div>';
  return html;
}

function escAttr(s){return (s||"").replace(/"/g,'&quot;');}
function earliest(arr){
  var v=arr.filter(function(x){return x;}).sort();
  return v[0]||"";
}
function latest(arr){
  var v=arr.filter(function(x){return x;}).sort();
  return v[v.length-1]||"";
}
function daysBetween(a,b){
  if(!a||!b)return null;
  var da=toDate(a),db=toDate(b);
  if(!da||!db)return null;
  var d=Math.round((db-da)/86400000)+1;
  return d>0?d:null;
}

                             ["工作開始","工作結束"]];

// 這一份設定在分頁關掉前都留著，不用每次重填
var PLAN_PREFS = {start:"", off:[], extra:"", lock:{}, pick:{}, mode:"auto", asked:[]};
var MODE_HINT = {
  auto:"沒排過、或者排程已經過期的案會先打勾。不對就自己改。",
  all:"所有案全部打勾重新排。既有的工作日期一律作廢，改以每個案的上片日、Final 交件日為基準往前推。",
  keep:"只打勾完全沒排過的案。已經有工作日期的一律不動，過期的也不會被重排。"
};

var STAGE_FIELDS = ["cut1S","cut1E","cut1Due","v1S","v1E","v1Due","bizS","bizE","bizDue","finalDue"];
var KNOWN_KEYS = ["id","notionId","name","client","status","airDate","closed",
                  "cut1Done","v1Done","bizDone","finalDone","noCut1","noBiz"].concat(STAGE_FIELDS);
// 排程用不到的欄位(金額、看板位置等)，不要塞進 Prompt
var SKIP_KEYS = ["type","kind","類型","length","note","month","order",
                 "fee","feeItems","costItems","taxCut","overRate","kanbanPos",
                 "editS","editE","workStart","workEnd","availStart","availEnd",
                 "workS","workE","fullS","fullE","planS","planE","schedS","schedE",
                 "startDate","endDate"];

function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function md(s){
  if(!s)return "";
  var p=String(s).split("-");
  return p.length>=3?(p[1]+"/"+p[2]):s;
}

// airDate 可能是 "10/01" 這種沒有年份的格式，補上年份才排得對
function airKey(p){
  var a=String(p.airDate||"").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(a))return a;
  var m=a.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if(!m)return "9999-99-99";
  var yr=(p.month&&/^\d{4}/.test(p.month))?p.month.slice(0,4)
         :String(new Date().getFullYear());
  var key=yr+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");
  // 上片日比工作月份還早 → 應該是隔年
  if(p.month&&/^\d{4}-\d{2}$/.test(p.month)&&key<p.month+"-01"){
    key=(parseInt(yr,10)+1)+key.slice(4);
  }
  return key;
}

function pendingProjects(){
  var INCLUDE=["等待素材","待確認","初剪待執行"];
  return state.projects.filter(function(p){
    if(p.closed||p.finalDone)return false;
    return INCLUDE.indexOf(p.status)>=0;
  }).sort(function(a,b){
    var x=airKey(a), y=airKey(b);
    return x<y?-1:(x>y?1:0);
  });
}

/* ─── 已排好的案：略過不重排，但要算進額度 ─────────────────── */

function workRangeFields(){
  if(WORK_RANGE_OVERRIDE)return WORK_RANGE_OVERRIDE;
  var probe=state.projects[0];
  if(!probe)return null;
  for(var i=0;i<WORK_RANGE_CANDIDATES.length;i++){
    var c=WORK_RANGE_CANDIDATES[i];
    if(Object.prototype.hasOwnProperty.call(probe,c[0])&&
       Object.prototype.hasOwnProperty.call(probe,c[1]))return c;
  }
  return null;
}

function schedDates(p){
  return [p.cut1S,p.cut1E,p.cut1Due,p.v1S,p.v1E,p.v1Due,p.bizS,p.bizE,p.bizDue]
         .filter(function(x){return !!x;}).sort();
}
function schedEnd(p){var d=schedDates(p);return d.length?d[d.length-1]:"";}
function hasSchedule(p){return schedDates(p).length>0;}
function isStale(p){
  var e=schedEnd(p);
  if(!e)return false;
  return e < (PLAN_PREFS.start||todayStr());
}
/* 打勾＝這次要重排。沒打勾的維持原日期，但仍然佔額度。
   auto — 沒排過、或排程已過期的才要重排
   all  — 全部重排
   keep — 只重排完全沒排過的 */
function planMode(){return PLAN_PREFS.mode||"auto";}
function basePick(p){
  var m=planMode();
  if(m==="all")return true;
  if(m==="keep")return !hasSchedule(p);
  return !hasSchedule(p)||isStale(p);
}
function willReplan(p){
  if(Object.prototype.hasOwnProperty.call(PLAN_PREFS.pick,p.id))return !!PLAN_PREFS.pick[p.id];
  return basePick(p);
}
function setPick(pid,v){PLAN_PREFS.pick[pid]=v;render();}
/* 換模式時把手動改過的勾選清掉，不然會看不出來模式有生效 */
function setMode(m){PLAN_PREFS.mode=m;PLAN_PREFS.pick={};render();}
function schedSummary(p){
  var bits=[];
  if(!p.noCut1&&(p.cut1S||p.cut1Due))bits.push("初剪 "+(p.cut1S||p.cut1Due)+(p.cut1Due&&p.cut1Due!==p.cut1S?" → "+p.cut1Due:""));
  if(p.v1S||p.v1Due)bits.push("V1/ES "+(p.v1S||p.v1Due)+(p.v1Due&&p.v1Due!==p.v1S?" → "+p.v1Due:""));
  if(!p.noBiz&&(p.bizS||p.bizDue))bits.push("業配 "+(p.bizS||p.bizDue)+(p.bizDue&&p.bizDue!==p.bizS?" → "+p.bizDue:""));
  if(p.finalDue)bits.push("Final "+p.finalDue);
  return bits.length?bits.join(" · "):"(沒有已排定的日期)";
}
function splitProjects(){
  var all=pendingProjects(), locked=[], open=[];
  all.forEach(function(p){(willReplan(p)?open:locked).push(p);});
  return {all:all,locked:locked,open:open};
}

/* ─── 休假設定 ─────────────────────────────────────────────── */

function addOff(){
  PLAN_PREFS.off.push({s:"",e:"",why:""});
  render();
}
function delOff(i){
  PLAN_PREFS.off.splice(i,1);
  render();
}
function setOff(i,k,v){
  if(!PLAN_PREFS.off[i])return;
  PLAN_PREFS.off[i][k]=v;
  if(k==="s"&&!PLAN_PREFS.off[i].e)PLAN_PREFS.off[i].e=v;   // 單日休假免填兩次
  refreshPrompt();
}
/* ── 下一個可以接新案的日期 ────────────────────────────────
   長片同時進行以 2 個為主，所以往前找第一個「在跑的長片 ≤ 1」的工作天。
   週末、休假日都跳過。案子佔用的期間取最早階段起日 → 最晚交件日。   */
function isOffDay(ds){
  return (PLAN_PREFS.off||[]).some(function(o){
    var a=o.s||o.e, b=o.e||o.s;
    if(!a)return false;
    return ds>=a&&ds<=b;
  });
}
function busySpan(p){
  var d=[getField(p,"cut1S"),getField(p,"v1S"),getField(p,"bizS"),
         getField(p,"cut1Due"),getField(p,"v1Due"),getField(p,"bizDue")]
        .filter(function(x){return !!x;}).sort();
  if(!d.length)return null;
  return {s:d[0], e:d[d.length-1]};
}
function nextOpenDate(){
  var vis=pendingProjects().filter(function(p){
    return !/短影|短片|shorts/i.test(projType(p));
  });
  var spans=vis.map(busySpan).filter(function(x){return !!x;});
  var start=PLAN_PREFS.start||todayStr();
  var cur=toDate(start);
  if(!cur)return null;
  for(var i=0;i<400;i++){
    var w=cur.getDay();
    var ds=cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0");
    if(w!==0&&w!==6&&!isOffDay(ds)){
      var n=0;
      spans.forEach(function(sp){if(ds>=sp.s&&ds<=sp.e)n++;});
      if(n<=1)return {date:ds, running:n, total:spans.length};
    }
    cur.setDate(cur.getDate()+1);
  }
  return null;
}

function offLines(){
  return PLAN_PREFS.off.filter(function(o){return o.s||o.e;}).map(function(o){
    var a=o.s||o.e, b=o.e||o.s;
    var txt=(a===b)?a+"（單日）":a+" → "+b;
    if(o.why&&o.why.trim())txt+="（"+o.why.trim()+"）";
    return txt;
  });
}

/* ─── 1. 產生 Prompt ───────────────────────────────────────── */

function progressLine(p){
  var bits=[];
  if(p.noCut1)bits.push("初剪: 不需要");
  else bits.push("初剪: "+(p.cut1Done?"已交":"未交")+(p.cut1Due?"，原訂 "+p.cut1Due:""));
  bits.push("V1/ES: "+(p.v1Done?"已交":"未交")+(p.v1Due?"，原訂 "+p.v1Due:""));
  if(!p.noBiz&&(p.bizS||p.bizDue)){
    bits.push("業配期間: "+(p.bizS||p.bizDue)+" → "+(p.bizDue||p.bizS)+(p.bizDone?"(已交)":""));
  }
  bits.push("Final: "+(p.finalDone?"已交":"未交")+(p.finalDue?"，原訂 "+p.finalDue:""));
  return bits.join(" · ");
}
function workWindowVals(p){
  var rf=workRangeFields();
  var s=rf?(p[rf[0]]||""):"";
  var e=rf?(p[rf[1]]||""):"";
  if(!s&&!e){
    s=p.editS||p.workStart||p.availStart||p.workS||"";
    e=p.editE||p.workEnd||p.availEnd||p.workE||"";
  }
  return [s,e];
}
function workWindow(p){
  var v=workWindowVals(p);
  return (v[0]||"?")+" → "+(v[1]||"?");
}
/* 寫進 Prompt 的版本：把「有沒有填開始日」講清楚，不然 AI 看到 ? 不知道該怎麼辦 */
function workWindowLine(p){
  var v=workWindowVals(p), s=v[0], e=v[1];
  var t=(s||"未填")+" → "+(e||"未填");
  if(s)t+="  ← 開始日已確定，工作開始日不得早於 "+s+"(中間怎麼安排你決定)";
  else t+="  ← 開始日未填，請自行判斷何時開工，並倒推出素材最晚到齊日";
  if(e)t+="；所有交件須在 "+e+" 之前完成";
  return t;
}
function projType(p){
  return p.type||p.kind||p["類型"]||"長片";
}

function projBlock(p,i){
  var t="";
  t+="\n### "+(i+1)+". "+p.name+(p.client?" · "+p.client:"")+"\n";
  t+="- 類型: "+projType(p)+" / 上片日: "+md(p.airDate)+" / 狀態: "+(p.status||"未標")+"\n";
  t+="- 可工作期間: "+workWindowLine(p)+"\n";
  t+="- 進度: "+progressLine(p)+"\n";
  if(p.length)t+="- 片長: "+p.length+"\n";
  if(p.note)t+="- 備註: "+String(p.note).replace(/\n/g," ")+"\n";
  var pn=pNote(p);
  if(pn)t+="- **排程限制(我指定的，必須遵守): "+pn.replace(/\n/g," ")+"**\n";
  t+="- id: `"+p.id+"`\n";
  var extras=Object.keys(p).filter(function(k){
    if(KNOWN_KEYS.indexOf(k)>=0)return false;
    if(SKIP_KEYS.indexOf(k)>=0)return false;
    var v=p[k];
    return v!==null&&v!==undefined&&v!==""&&typeof v!=="object";
  });
  if(extras.length)t+="- 其他: "+extras.map(function(k){return k+"="+p[k];}).join(" / ")+"\n";
  return t;
}

function buildPrompt(){
  var sp=splitProjects();
  var offs=offLines();
  var t="剪輯案工作排程規劃\n";
  t+="今天是 "+todayStr()+"。以下是我手上未完成的剪接案，請依照規則排出每個專案的工作日程。\n\n";

  t+="## 前提\n";
  t+="- 我最早可以開工的日期："+(PLAN_PREFS.start||todayStr())+"\n";
  t+="- 工作天以週一～週五計算，週末不排\n";
  if(offs.length){
    t+="- 以下日子我休假，完全不能工作，排程請整段跳過，也不計入工作天：\n";
    offs.forEach(function(o){t+="  - "+o+"\n";});
  }
  if(PLAN_PREFS.extra&&PLAN_PREFS.extra.trim()){
    t+="- 額外狀況："+PLAN_PREFS.extra.trim()+"\n";
  }
  var pm=planMode();
  if(pm==="all"){
    t+="\n## 這次的排法\n";
    t+="**全部重新排。**下面每個案既有的工作日期(初剪、V1、業配的起迄)一律作廢，不要參考、也不要沿用。\n";
    t+="唯一的例外是**已經存在的 V1/ES 交件日**：那是對客戶承諾過的，請保留不動並當成該案的錨點，其餘日期繞著它重排。\n";
    t+="沒有 V1/ES 交件日的案，才以**上片日與 Final 交件日為基準**往前推算完整的工作時程。\n";
    t+="上片日 / Final 日本身不要改動；若倒推回來已經來不及，標記 🚨 並在說明裡點出。\n";
  }else if(pm==="keep"){
    t+="\n## 這次的排法\n";
    t+="**只要已經有工作日期的案，一律不要動。**這次只需要替下面 B 區、也就是完全沒有工作日期的那幾個案排程。\n";
    t+="請把它們塞進 A 區留下來的空檔，不能讓同時進行的長片數超過上限。\n";
  }

  var shorts=sp.open.filter(function(p){return /短影|短片|shorts/i.test(projType(p));});
  t+="\n## 排程規則\n"+PLAN_RULES+"\n";
  var noted=sp.all.filter(function(p){return pNote(p);});
  if(noted.length){
    t+="\n有標「排程限制」的案，那是我指定的硬性條件，**優先於上面的一般規則**，不能為了排得好看而違反。\n";
    t+="若某個限制跟其他規則或上片日衝突、排不出來，請直接說明衝突在哪裡，不要自己硬排。\n";
  }
  if(shorts.length)t+="\n(這次要排的案裡有 "+shorts.length+" 個短影，可直接安排，不佔長片額度)\n";
  t+="\n";

  if(sp.locked.length){
    t+="## A. 已經排好的案（不要重排）\n";
    t+="這些案的日期已經定了，**請原封不動，不要更改，也不要放進最後的 JSON**。\n";
    t+="但它們佔用的工作日必須算進「一天同時 2–3 個長片案」的額度，排 B 區的案子時要一併考慮，不能撞到上限。\n";
    sp.locked.forEach(function(p,i){
      t+=projBlock(p,i);
      t+="- 已排定: "+schedSummary(p)+"\n";
    });
    t+="\n";
  }

  t+="## "+(sp.locked.length?"B. 這次要排的案":"專案清單")+"\n";
  if(!sp.open.length){
    t+="(沒有需要排的案，全部都已經排好了)\n";
  }
  sp.open.forEach(function(p,i){t+=projBlock(p,i);});

  t+="\n---\n\n## 輸出格式要求\n";
  t+="請依照以下格式，**逐一專案列出**(不要用大表格)：\n\n";
  t+="```\n專案名稱\n工作時間  開始日期-結束日期 (天數)\n初剪     開始日期-結束日期 (天數)\nV1       開始日期-結束日期 (天數)\nFINAL    日期\n```\n\n";
  t+="「初剪」這欄只有在專案進度是「初剪未交」時才列出，已交或不需的專案跳過。\n";
  t+="逾期風險案件請在專案名稱旁標記 🚨。\n";
  if(sp.locked.length)t+="A 區的案不用列工作時間，但如果它們造成額度吃緊，請在說明裡點出來。\n";
  t+="\n最後請附上「排程概念說明」，用條列式簡短說明：\n";
  t+="1. 為什麼這樣排序(哪個案件優先、為什麼)\n";
  t+="2. 哪幾天長片同時量達到上限"+(sp.locked.length?"(含 A 區已排好的案)":"")+"\n";
  t+="3. 等待素材/等待回饋空檔如何被短影或其他案件填補\n";
  t+="4. 業配如有，排在哪個時間點\n";
  t+="5. 排完之後我最快哪一天可以再接一支新的長片(以同時 2 支為基準判斷，說明那天手上還在跑幾支)\n\n";

  t+="## 最後請附上 JSON(我的排程網站要一鍵匯入用)\n";
  t+="在回覆的**最末**放一個 ```json 區塊";
  t+=(sp.locked.length?"，**只放 B 區的 "+sp.open.length+" 個案**，A 區的不要放進去":"");
  t+="。日期一律 YYYY-MM-DD，沒有的階段填 null，`id` 原封不動照抄上面的值(這是匯入的依據，不能改)：\n\n";
  t+="```json\n";
  t+="{\n";
  t+='  "summary": {\n';
  t+='    "order": "為什麼這樣排序",\n';
  t+='    "peak": "哪幾天長片同時量達到上限",\n';
  t+='    "gaps": "空檔如何被填補",\n';
  t+='    "biz": "業配排在哪個時間點",\n';
  t+='    "next": "排完之後，我最快哪一天可以再接一支新的長片(要說明那天在跑幾支)"\n';
  t+="  },\n";
  t+='  "projects": [\n';
  t+="    {\n";
  t+='      "id": "照抄專案 id", "name": "專案名稱(方便我核對)",\n';
  t+='      "flag": "有逾期風險就填 🚨，否則空字串",\n';
  t+='      "cut1S": "初剪開始", "cut1Due": "初剪交件",\n';
  t+='      "v1S": "V1/ES 開始", "v1Due": "V1/ES 交件",\n';
  t+='      "bizS": "業配開始或 null", "bizDue": "業配交件或 null",\n';
  t+='      "finalDue": "Final 交件",\n';
  t+='      "note": "一句話備註，例如素材最晚到齊日；沒有就填空字串"\n';
  t+="    }\n";
  t+="  ]\n";
  t+="}\n";
  t+="```\n\n";
  t+="補充：某案確定不需要初剪或業配，可在該筆多加 `\"noCut1\": true` 或 `\"noBiz\": true`。JSON 內不要有註解或多餘文字。\n";
  return t;
}

function openExport(){
  if(!PLAN_PREFS.start)PLAN_PREFS.start=todayStr();
  state.exp={};
  render();
}
function closeExport(){state.exp=null;render();}
function refreshPrompt(){
  var ta=document.getElementById("exp-out");
  if(ta)ta.value=buildPrompt();
  var c=document.getElementById("exp-count");
  if(c)c.textContent=buildPrompt().length+" 字";
}
/* 複製成功後直接接到「貼上排程」，不用自己關掉再開 */
function gotoImport(){
  state.exp=null;
  openImport();
  setTimeout(function(){
    var el=document.getElementById("imp-in");
    if(el)el.focus();
  },60);
}
function copyPrompt(){
  var ta=document.getElementById("exp-out");
  if(!ta)return;
  var txt=ta.value;
  ta.focus();ta.select();

  /* 先用同步的 execCommand，確保在畫面重繪前就完成複製 */
  var ok=false;
  try{ok=document.execCommand("copy");}catch(err){}

  /* 再補一次新版 API；它是非同步的，不拿它當跳轉條件 */
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{
      navigator.clipboard.writeText(txt).then(function(){},function(){});
      ok=true;
    }catch(err){}
  }

  if(ok){
    /* 記下這次要求 Claude 排的是哪幾案，貼回來時好比對有沒有漏 */
    PLAN_PREFS.asked=splitProjects().open.map(function(p){return {id:p.id,name:p.name};});
    showToast("✅ 已複製 · 貼給 Claude，回覆貼到下面");
    gotoImport();
  }else{
    showToast("複製失敗 · 請手動全選複製");
  }
}

function renderExport(){
  var sp=splitProjects();
  var h='<div class="modal-overlay" onclick="if(event.target===this)closeExport()">';
  h+='<div class="modal" style="max-width:780px">';
  h+='<div class="modal-title">📋 產生 Prompt</div>';
  h+='<div class="modal-sub">待執行共 '+sp.all.length+' 案 · 這次要排 '+sp.open.length+' 案，'+sp.locked.length+' 案已排好只列入考量</div>';

  if(!sp.all.length){
    h+='<div class="imp-err">目前沒有狀態為「等待素材 / 待確認 / 初剪待執行」的案，沒東西可以排。</div>';
    h+='<div class="modal-btns"><button class="btn" onclick="closeExport()">關閉</button></div></div></div>';
    return h;
  }

  h+='<div class="pstep"><span class="pstep-n">1</span><span class="pstep-t">開工日</span></div>';
  h+='<div class="row2">';
  h+='<div><div class="flabel">最早可以開工</div><input type="date" class="fc" value="'+escAttr(PLAN_PREFS.start)+'" onchange="PLAN_PREFS.start=this.value;render()"></div>';
  h+='<div><div class="flabel">額外狀況(選填)</div><input type="text" class="fc" placeholder="例如：這批素材畫質很差，剪起來會慢" value="'+escAttr(PLAN_PREFS.extra)+'" oninput="PLAN_PREFS.extra=this.value;refreshPrompt()"></div>';
  h+='</div>';

  h+='<div class="pstep"><span class="pstep-n">2</span><span class="pstep-t">休假 / 不排班的日子</span><span class="pstep-h">這幾天會整段跳過，不算工作天</span></div>';
  if(!PLAN_PREFS.off.length){
    h+='<div class="off-empty">沒有設定休假 · 需要的話按下面新增</div>';
  }
  PLAN_PREFS.off.forEach(function(o,i){
    h+='<div class="off-row">';
    h+='<input type="date" class="fc" value="'+escAttr(o.s)+'" onchange="setOff('+i+',\'s\',this.value);render()">';
    h+='<input type="date" class="fc" value="'+escAttr(o.e)+'" onchange="setOff('+i+',\'e\',this.value)">';
    h+='<input type="text" class="fc" placeholder="原因(選填)" value="'+escAttr(o.why)+'" oninput="setOff('+i+',\'why\',this.value)">';
    h+='<button class="off-x" onclick="delOff('+i+')" title="刪掉這筆">✕</button>';
    h+='</div>';
  });
  h+='<button class="off-add" onclick="addOff()">＋ 新增休假期間</button>';

  h+='<div class="pstep"><span class="pstep-n">3</span><span class="pstep-t">這次要怎麼排</span><span class="pstep-h">打勾＝這次要重排；沒打勾的維持原日期，但仍佔額度</span></div>';
  var pm=planMode();
  h+='<div class="mode-row">';
  h+='<button class="mode-b'+(pm==="auto"?" on":"")+'" onclick="setMode(\'auto\')">自動判斷</button>';
  h+='<button class="mode-b'+(pm==="all"?" on":"")+'" onclick="setMode(\'all\')">全部重排</button>';
  h+='<button class="mode-b'+(pm==="keep"?" on":"")+'" onclick="setMode(\'keep\')">只排沒排過的</button>';
  h+='</div>';
  h+='<div class="lock-sum">'+MODE_HINT[pm]+'</div>';
  sp.all.forEach(function(p){
    var on=willReplan(p), stale=isStale(p), has=hasSchedule(p);
    h+='<div class="lock-row'+(on?' on':'')+'">';
    h+='<input type="checkbox"'+(on?' checked':'')+' onchange="setPick(\''+p.id+'\',this.checked)">';
    h+='<div>';
    h+='<div class="lock-nm">'+escapeHtml(p.name);
    if(!has)h+=' <span class="lock-tag">還沒排</span>';
    else if(stale)h+=' <span class="lock-tag stale">排程已過期</span>';
    h+='</div>';
    h+='<div class="lock-meta">'+(p.airDate?p.airDate+' 上片 · ':'')+escapeHtml(has?schedSummary(p):"沒有已排定的工作日期")+'</div>';
    h+='<input class="fc note-in" value="'+escAttr(pNote(p))+'" placeholder="排程限制（選填）例如：9 月才開工，8 月不要排" onchange="setPNote(\''+p.id+'\',this.value)">';
    h+='</div></div>';
  });

  h+='<div class="pstep"><span class="pstep-n">4</span><span class="pstep-t">複製這段，貼給 Claude</span><span class="pstep-h" id="exp-count">'+buildPrompt().length+' 字</span></div>';
  if(!sp.open.length){
    h+='<div class="imp-err">一個案都沒打勾，這次沒有東西要排。勾幾個起來再複製。</div>';
  }
  h+='<textarea class="pta" id="exp-out" rows="12" readonly onclick="this.select()">'+escapeHtml(buildPrompt())+'</textarea>';

  h+='<div class="pnote" style="margin-top:12px">Claude 回覆的最後會有一段 <b>```json</b>，只包含要排的案。把那段(或整則回覆)複製起來，回到這裡按 <b>📥 貼上排程</b> 就能一鍵填入，排程說明和 🚨 也會一起帶回甘特圖。</div>';

  h+='<div class="modal-btns">';
  h+='<button class="btn" onclick="closeExport()">關閉</button>';
  h+='<button class="btn primary" onclick="copyPrompt()"'+(sp.open.length?'':' disabled')+'>📋 複製 Prompt</button>';
  h+='</div></div></div>';
  return h;
}

/* ─── 2. 貼回 JSON ─────────────────────────────────────────── */

function parsePlanText(txt){
  if(!txt||!txt.trim())throw new Error("還沒貼上任何內容。");
  var s=txt.trim(), cands=[];
  var fences=s.match(/```[a-zA-Z]*\s*[\s\S]*?```/g);
  if(fences)fences.forEach(function(b){
    cands.push(b.replace(/^```[a-zA-Z]*\s*/,"").replace(/```$/,"").trim());
  });
  cands.push(s);
  var i=s.indexOf("{"), j=s.lastIndexOf("}");
  if(i>=0&&j>i)cands.push(s.slice(i,j+1));
  var i2=s.indexOf("["), j2=s.lastIndexOf("]");
  if(i2>=0&&j2>i2)cands.push(s.slice(i2,j2+1));

  /* 不能遇到第一個能解的就收。回覆裡常常不只一個 ```json 區塊
     (或者連 Prompt 一起貼進來，Prompt 尾巴那段範例只有一個案)，
     全部試完，挑案數最多的那一塊。*/
  var best=null;
  for(var k=0;k<cands.length;k++){
    if(!cands[k])continue;
    var got=null;
    try{
      var o=JSON.parse(cands[k]);
      if(Array.isArray(o)&&o.length)got={projects:o,summary:null};
      else if(o&&Array.isArray(o.projects)&&o.projects.length)got={projects:o.projects,summary:o.summary||null};
      else if(o&&Array.isArray(o.plan)&&o.plan.length)got={projects:o.plan,summary:o.summary||null};
      else if(o&&(o.id||o.name))got={projects:[o],summary:null};
    }catch(err){}
    if(!got)continue;
    if(!best||got.projects.length>best.projects.length)best=got;
    /* 案數一樣時，有 summary 的優先 */
    else if(got.projects.length===best.projects.length&&!best.summary&&got.summary)best=got;
  }
  if(best)return best;
  throw new Error("解析不出 JSON。請確認有把 Claude 回覆最後那段 ```json 完整貼進來(含最外層的大括號)。");
}

function normName(s){return (s||"").replace(/[\s·・\/\-—|,，。]/g,"");}

function findTarget(row){
  var byId=state.projects.filter(function(p){
    return !p.closed&&row.id&&(p.id===row.id||p.notionId===row.id);
  });
  if(byId.length===1)return {p:byId[0],how:"id"};
  if(!row.name)return {p:null,how:"none"};
  var n=normName(row.name);
  var exact=state.projects.filter(function(p){
    return !p.closed&&!p.finalDone&&normName(p.name)===n;
  });
  if(exact.length===1)return {p:exact[0],how:"name"};
  var loose=state.projects.filter(function(p){
    if(p.closed||p.finalDone)return false;
    var pn=normName(p.name);
    return pn.indexOf(n)>=0||n.indexOf(pn)>=0;
  });
  if(loose.length===1)return {p:loose[0],how:"name-loose"};
  return {p:null,how:loose.length>1?"ambiguous":"none"};
}

function cleanDate(v){
  if(v===null||v===undefined)return null;
  var s=String(v).trim();
  if(!s||s==="null"||s==="-"||s==="無")return null;
  var m=s.replace(/\//g,"-").match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m)return undefined;                       // undefined = 格式看不懂
  return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
}

function expandRow(row){
  var f={},warn=[];
  function put(sKey,eKey,dKey,sVal,dVal){
    var s=cleanDate(sVal),d=cleanDate(dVal);
    if(s===undefined||d===undefined){warn.push(sKey+" 日期格式看不懂");return;}
    if(s===null&&d===null)return;               // 沒給就不動原本的
    f[sKey]=s||d; f[eKey]=d||s; f[dKey]=d||s;
  }
  put("cut1S","cut1E","cut1Due",row.cut1S,row.cut1Due);
  put("v1S","v1E","v1Due",row.v1S,row.v1Due);
  put("bizS","bizE","bizDue",row.bizS,row.bizDue);
  var fd=cleanDate(row.finalDue);
  if(fd===undefined)warn.push("finalDue 日期格式看不懂");
  else if(fd!==null)f.finalDue=fd;
  if(row.noCut1===true||row.noCut1===false)f.noCut1=row.noCut1;
  if(row.noBiz===true||row.noBiz===false)f.noBiz=row.noBiz;
  if(f.cut1S&&f.noCut1!==true)f.noCut1=false;
  if(f.bizS&&f.noBiz!==true)f.noBiz=false;

  /* 可工作期間(editS/editE)是我自己填的條件——最早可開始、最晚要完成，
     不是排程算出來的結果，所以匯入時絕對不能覆寫，否則下一輪 AI 會拿
     自己上次排的日期當成素材可用日，一輪一輪偏掉。 */
  var rf=workRangeFields();
  if(rf){
    var ws=state.projects.filter(function(x){return x.id===(row.id||"");})[0];
    var all=[f.cut1S,f.v1S,f.bizS,f.cut1Due,f.v1Due,f.bizDue,f.finalDue]
            .filter(function(x){return !!x;}).sort();
    if(ws&&all.length){
      var lo=ws[rf[0]]||"", hi=ws[rf[1]]||"";
      if(lo&&all[0]<lo)warn.push("工作開始日 "+all[0]+" 早於可工作期間起始日 "+lo);
      if(hi&&all[all.length-1]>hi)warn.push("最後交件日 "+all[all.length-1]+" 超過可工作期間結束日 "+hi);
    }
  }
  /* 回饋緩衝檢查：V1 交件到 Final 之間至少要隔 3 個工作天 */
  var vd=f.v1Due||null, fdue=f.finalDue||null;
  if(vd&&fdue){
    var gap=workDaysBetween(vd,fdue);
    if(gap!==null&&gap<FEEDBACK_MIN_DAYS){
      warn.push("V1 交件 "+vd+" 到 Final "+fdue+" 中間沒有留任何工作天，至少要隔 1 天給回饋修改");
    }
  }
  return {fields:f,warn:warn};
}

/* 兩個日期之間隔幾個工作天(不含起日、含迄日，只算週一–週五) */
function workDaysBetween(a,b){
  var d1=toDate(a), d2=toDate(b);
  if(!d1||!d2)return null;
  if(d2<d1)return 0;
  var n=0, cur=new Date(d1.getTime());
  cur.setDate(cur.getDate()+1);
  while(cur<=d2){
    var w=cur.getDay();
    if(w!==0&&w!==6)n++;
    cur.setDate(cur.getDate()+1);
  }
  return n;
}

var FIELD_LABEL={editS:"工作起",editE:"工作迄",workS:"工作起",workE:"工作迄",workStart:"工作起",workEnd:"工作迄",
                 fullS:"工作起",fullE:"工作迄",planS:"工作起",planE:"工作迄",
                 schedS:"工作起",schedE:"工作迄",startDate:"工作起",endDate:"工作迄",
                 cut1S:"初剪起",cut1E:"初剪迄",cut1Due:"初剪交",
                 v1S:"V1 起",v1E:"V1 迄",v1Due:"V1 交",
                 bizS:"業配起",bizE:"業配迄",bizDue:"業配交",
                 finalDue:"Final",noCut1:"無初剪",noBiz:"無業配"};

function openImport(){
  state.imp={text:"",rows:null,summary:null,err:null,sel:{}};
  render();
}
function closeImport(){state.imp=null;render();}

function parseImport(){
  var ta=document.getElementById("imp-in");
  if(ta)state.imp.text=ta.value;
  try{
    var got=parsePlanText(state.imp.text);
    var rows=got.projects.map(function(r,i){
      var t=findTarget(r), ex=expandRow(r), changes=[];
      if(t.p){
        Object.keys(ex.fields).forEach(function(k){
          var oldV=(t.p[k]===null||t.p[k]===undefined)?"":t.p[k];
          var newV=ex.fields[k];
          var a=(typeof oldV==="boolean")?(oldV?"是":"否"):oldV;
          var b=(typeof newV==="boolean")?(newV?"是":"否"):newV;
          if(String(a)!==String(b))changes.push({k:k,old:a,nw:b});
        });
      }
      /* V1 交件日是對客戶承諾過的，被往後拖就要當場講 */
      if(t.p&&t.p.v1Due&&ex.fields.v1Due&&ex.fields.v1Due>t.p.v1Due){
        ex.warn=ex.warn.concat(["V1 交件日從 "+t.p.v1Due+" 被往後拖到 "+ex.fields.v1Due+"，這是已承諾的日期"]);
      }
      return {i:i,row:r,target:t,fields:ex.fields,warn:ex.warn,changes:changes};
    });
    state.imp.rows=rows;
    state.imp.summary=got.summary;
    state.imp.err=null;
    rows.forEach(function(r){state.imp.sel[r.i]=!!(r.target.p&&r.changes.length);});
  }catch(err){
    state.imp.rows=null;
    state.imp.err=String(err.message||err);
  }
  render();
}

function applyImport(){
  var rows=state.imp.rows||[], done=0;
  rows.forEach(function(r){
    if(!r.target.p)return;
    var p=r.target.p;
    // 備註和 🚨 只是頁面上的提醒，不會寫回 Notion
    if(r.row.flag||r.row.note){
      state.planNotes[p.id]={flag:r.row.flag||"",note:r.row.note||""};
    }
    if(!state.imp.sel[r.i])return;
    Object.keys(r.fields).forEach(function(k){setField(p,k,r.fields[k]);});
    done++;
  });
  if(state.imp.summary)state.summary=state.imp.summary;
  state.imp=null;
  if(done===0)showToast("沒有填入任何案");
  else showToast("已填入 "+done+" 案 · 檢查甘特圖後按「存回 Notion」");
}

function renderImport(){
  var m=state.imp;
  var h='<div class="modal-overlay" onclick="if(event.target===this)closeImport()">';
  h+='<div class="modal" style="max-width:700px">';
  h+='<div class="modal-title">📥 貼上排程</div>';
  h+='<div class="modal-sub">把 Claude 回覆裡的 json 貼進來 · 先預覽再填入</div>';

  if(!m.rows){
    h+='<div class="pnote">整則回覆直接貼也可以，會自動抓出裡面的 <b>```json</b>。</div>';
    if(m.err)h+='<div class="imp-err">⚠ '+escapeHtml(m.err)+'</div>';
    h+='<textarea class="pta" id="imp-in" rows="11" placeholder="在這裡貼上 Claude 的回覆…">'+escapeHtml(m.text||"")+'</textarea>';
    h+='<div class="modal-btns">';
    h+='<button class="btn" onclick="closeImport()">取消</button>';
    h+='<button class="btn primary" onclick="parseImport()">解析並預覽</button>';
    h+='</div></div></div>';
    return h;
  }

  /* 比對這次要排的案數，json 漏了就直接講 */
  var asked=PLAN_PREFS.asked||[];
  if(asked.length){
    var hit={};
    m.rows.forEach(function(r){if(r.target.p)hit[r.target.p.id]=1;});
    var miss=asked.filter(function(a){return !hit[a.id];});
    if(miss.length){
      h+='<div class="imp-err">⚠ 這次要排 '+asked.length+' 案，但這份 JSON 只對到 '+(asked.length-miss.length)+' 案。<br>';
      h+='沒出現的：'+miss.map(function(a){return escapeHtml(a.name);}).join("、")+'<br>';
      h+='多半是回覆裡的 json 沒貼完整，或者 Claude 漏排了。可以先填入這幾案，也可以回去把完整的那段再貼一次。</div>';
    }
  }

  var okCount=0;
  m.rows.forEach(function(r){
    var p=r.target.p, ok=!!p, hasChange=r.changes.length>0;
    if(ok&&hasChange)okCount++;
    h+='<div class="imp-item'+(ok?'':' miss')+'">';
    h+='<div class="imp-check"><input type="checkbox"'+((m.sel[r.i]&&ok)?' checked':'')+((ok&&hasChange)?'':' disabled')+' onchange="state.imp.sel['+r.i+']=this.checked"></div>';
    h+='<div>';
    h+='<div class="imp-name">'+escapeHtml(r.row.name||"(未命名)")+(r.row.flag?' '+escapeHtml(r.row.flag):'');
    if(!ok)h+=' <span class="imp-tag warn">'+(r.target.how==="ambiguous"?"對到多筆":"找不到對應專案")+'</span>';
    else if(!hasChange)h+=' <span class="imp-tag same">日期沒變</span>';
    else h+=' <span class="imp-tag ok">'+r.changes.length+' 項變更</span>';
    h+='</div>';

    if(ok)h+='<div class="imp-target">→ '+escapeHtml(p.name)+(p.airDate?' · '+p.airDate+' 上片':'')+(r.target.how==="id"?'':' ·(用名稱對到)')+'</div>';
    else h+='<div class="imp-target">id：'+escapeHtml(String(r.row.id||"未提供"))+' · 這筆會被跳過</div>';

    if(r.row.note)h+='<div class="imp-note2">'+escapeHtml(String(r.row.note))+'</div>';
    if(r.warn.length)h+='<div class="imp-note2" style="color:var(--red)">⚠ '+escapeHtml(r.warn.join(" / "))+'</div>';

    if(ok&&hasChange){
      h+='<div class="imp-diff">';
      r.changes.forEach(function(c){
        h+='<div class="imp-d"><span class="k">'+(FIELD_LABEL[c.k]||c.k)+'</span>';
        if(c.old)h+='<span class="old">'+escapeHtml(String(c.old))+'</span>';
        h+='<span class="new">'+escapeHtml(String(c.nw))+'</span></div>';
      });
      h+='</div>';
    }
    h+='</div></div>';
  });

  if(!workRangeFields()){
    h+='<div class="imp-err">⚠ 偵測不到「完整時程」的開始/結束欄位，這兩格不會被寫回 Notion。<br>'+
       '在 Console 執行 <b>console.log(state.projects[0])</b> 找出欄位名，填進檔案最上面的 <b>WORK_RANGE_OVERRIDE</b> 就會自動補上。</div>';
  }
  if(m.summary){
    h+='<div class="pnote">✅ 有抓到「排程概念說明」，填入後會顯示在甘特圖上方。</div>';
  } else {
    h+='<div class="pnote">這次的 JSON 沒有 <b>summary</b> 欄位，甘特圖上方就不會有排程說明。日期還是照填。</div>';
  }
  h+='<div class="modal-btns">';
  h+='<button class="btn" onclick="state.imp.rows=null;render()" style="margin-right:auto">← 改貼別的</button>';
  h+='<button class="btn" onclick="closeImport()">取消</button>';
  h+='<button class="btn primary" onclick="applyImport()"'+(okCount===0?' disabled':'')+'>填入甘特圖'+(okCount?' ('+okCount+')':'')+'</button>';
  h+='</div></div></div>';
  return h;
}

/* ─── 3. 排程概念說明 ──────────────────────────────────────── */

var SUM_LABEL=[["order","排序邏輯"],["peak","同時上限"],["gaps","空檔填補"],["biz","業配時間"],["next","可接新案"]];

function clearSummary(){
  state.summary=null;
  state.planNotes={};
  render();
}

function renderSummary(){
  var s=state.summary;
  if(!s)return "";
  var any=SUM_LABEL.some(function(x){return s[x[0]];});
  if(!any)return "";
  var h='<div class="sum">';
  h+='<div class="sum-hd"><span>📌</span><span class="sum-title">排程概念說明</span>';
  h+='<button class="sum-x" onclick="clearSummary()" title="清掉說明和 🚨 標記">✕ 清除</button></div>';
  h+='<div class="sum-body">';
  SUM_LABEL.forEach(function(x){
    if(!s[x[0]])return;
    h+='<div class="sum-i"><div class="sum-k">'+x[1]+'</div><div class="sum-v">'+escapeHtml(String(s[x[0]]))+'</div></div>';
  });
  h+='</div></div>';
  return h;
}
